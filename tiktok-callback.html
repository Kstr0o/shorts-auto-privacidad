<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok autorizado</title><meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;background:#0e0e14;color:#fff;max-width:640px;margin:40px auto;padding:0 16px}code{display:block;background:#222;padding:12px;border-radius:8px;word-break:break-all;margin:12px 0}button{padding:10px 16px;border:0;border-radius:8px;background:#7c3aed;color:#fff;font-size:16px}</style></head>
<body><h1>Daily Streamer Clips Uploader</h1><p id="m">Leyendo respuesta de TikTok...</p><code id="c"></code><button id="b" hidden>Copiar codigo</button>
<script>
const p=new URLSearchParams(location.search),c=p.get('code'),e=p.get('error');
const m=document.getElementById('m'),k=document.getElementById('c'),b=document.getElementById('b');
if(c){m.textContent='Autorizado. Copia este codigo y pegalo donde te diga Claude (caduca en unos minutos):';k.textContent=c;b.hidden=false;b.onclick=()=>navigator.clipboard.writeText(c).then(()=>b.textContent='Copiado');}
else{m.textContent='No hay codigo. '+(e?('Error: '+e+' '+(p.get('error_description')||'')):'');k.hidden=true;}
</script></body></html>
